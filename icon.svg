<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Square for Launcher compatibility -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Compass rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#2c3e50" stroke-width="5" stroke-dasharray="10 10"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#34495e" stroke-width="3"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Compass Lines -->
  <line x1="256" y1="70" x2="256" y2="442" stroke="#1e293b" stroke-width="4"/>
  <line x1="70" y1="256" x2="442" y2="256" stroke="#1e293b" stroke-width="4"/>
  
  <!-- Direction Indicators -->
  <text x="256" y="60" font-family="system-ui, sans-serif" font-weight="900" font-size="28" fill="#fbbf24" text-anchor="middle">N</text>
  <text x="256" y="475" font-family="system-ui, sans-serif" font-weight="900" font-size="28" fill="#cbd5e1" text-anchor="middle">S</text>
  
  <!-- Sleek Golden Compass Needle -->
  <!-- Top Needle Gold Highlight -->
  <polygon points="256,90 290,256 256,220" fill="url(#goldGrad)"/>
  <!-- Top Needle Gold Shadow -->
  <polygon points="256,90 222,256 256,220" fill="#cc8800"/>
  
  <!-- Bottom Needle Premium Slate Highlight -->
  <polygon points="256,422 290,256 256,292" fill="#cbd5e1"/>
  <!-- Bottom Needle Premium Slate Shadow -->
  <polygon points="256,422 222,256 256,292" fill="#94a3b8"/>
  
  <!-- Elegant Center Pin -->
  <circle cx="256" cy="256" r="18" fill="#0f172a" stroke="#fbbf24" stroke-width="4"/>
  <circle cx="256" cy="256" r="6" fill="#fbbf24"/>
</svg>
